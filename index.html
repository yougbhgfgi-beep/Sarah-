    <!-- the site is dark everywhere: tell the browser before it paints, so the
         standalone app never flashes white on launch and ios renders dark

    <meta name="color-scheme" content="dark" />
    <style>
      html {
        background: #0d0508;
      }
      body {
        margin: 0;
        background: #0d0508;
      }

      /* حجم خط الرسالة جوه المظروف — بيتظبط من هنا بس.
         غيّر الرقمين دول وهيتظبط في الموبايل والكمبيوتر.
         (لو خليت الرسالة رمز واحد زي قلب، ارفع الرقم لـ 4rem
          وشيل الجملتين اللي تحته عشان يبقى في النص.) */
      .letter-body {
        font-size: 13px;
        line-height: 1.9;
      }
      @media (min-width: 640px) {
        .letter-body {
          font-size: 15px;
        }
      }

      /* الرسالة بقت طويلة، فعلى الموبايل كانت بتطلع بره الشاشة من غير
         أي طريقة تقراها. الكارت اللي جواها بقى منطقة تمرير مستقلة:
         الـ scroll بتاع الرسالة مش بيحرّك الصفحة، وبتقفل بـ contain
         عشان السحب جوه الرسالة مايعملش scroll-iPhone rubber-band. */
      .letter-body {
        -webkit-overflow-scrolling: touch;
      }
      div:has(> p.letter-body) {
        max-height: min(48vh, 420px);
        overflow-y: auto;
        overscroll-behavior: contain;
        /* شريط تمرير رفيع وناعم — الرسالة عربي، فالسهم الافتراضي مقلوب */
        scrollbar-width: thin;
        scrollbar-color: rgba(244, 63, 94, 0.35) transparent;
        /* hint that there is more below, so the cut-off text is not a mystery */
        mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 18px), transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 18px), transparent 100%);
      }
      div:has(> p.letter-body)::-webkit-scrollbar { width: 4px; }
      div:has(> p.letter-body)::-webkit-scrollbar-thumb {
        background: rgba(244, 63, 94, 0.35);
        border-radius: 99px;
      }
      div:has(> p.letter-body)::-webkit-scrollbar-track { background: transparent; }
      @media (min-width: 640px) {
        div:has(> p.letter-body) { max-height: min(56vh, 520px); }
      }

      /* زراري التمرير — بيظهروا بس والرسالة مفتوحة. */
      #letterNav {
        position: fixed;
        inset-inline: 0;
        z-index: 60;
        display: none;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
      }
      #letterNav.on { display: flex; }
      #letterNav button {
        pointer-events: auto;
        width: 46px;
        height: 46px;
        margin-inline: auto;
        border-radius: 50%;
        border: 1px solid rgba(244, 63, 94, 0.3);
        background: rgba(13, 5, 8, 0.75);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        color: #fda4af;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        font-family: inherit;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.25s, transform 0.25s, background 0.2s;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      }
      #letterNav button:hover { background: rgba(196, 13, 116, 0.3); }
      #letterNav button[hidden] { display: none; }
      #letterNav .up { top: calc(14px + env(safe-area-inset-top, 0px)); }
      #letterNav .down { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
      @media (prefers-reduced-motion: reduce) {
        #letterNav button { transition: none; }
      }
      /* ===== مقياس حبي (love-meter.js) =====
         كل الأنماط هنا. الكارت <button> عشان يوصله الكيبورد ويتقرا من
         قارئ الشاشة — div بـ cursor:pointer مش بيعمل أي من دول. */
      #loveMeter {
        padding: 3rem 1rem;
        text-align: center;
        position: relative;
        z-index: 10;
      }
      .lm-title {
        font-size: clamp(1.5rem, 4.5vw, 2.25rem);
        font-weight: 700;
        line-height: 1.35;
        margin-bottom: 2rem;
        color: rgb(196, 13, 116);
        text-shadow: 0 0 30px rgba(196, 13, 116, 0.35);
      }
      .lm-card {
        display: block;
        width: 100%;
        max-width: 42rem;
        margin: 0 auto;
        padding: 1.5rem;
        border-radius: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.15);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        box-shadow: 0 0 30px rgba(196, 13, 116, 0.2);
        color: #fff;
        font-family: inherit;
        text-align: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: background 0.3s;
      }
      .lm-card:hover { background: rgba(255, 255, 255, 0.2); }
      .lm-card:focus-visible {
        outline: 2px solid #f9a8d4;
        outline-offset: 3px;
      }
      @media (min-width: 768px) { .lm-card { padding: 3rem; } }

      .lm-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
      }
      .lm-badge {
        display: inline-block;
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-radius: 9999px;
        color: #fce7f3;
        background: rgba(131, 11, 157, 0.3);
      }
      .lm-readout {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        color: #fce7f3;
        min-height: 1.5rem; /* الرقم فاضي لحد ما تضغطي — والـ svg مكانش ينط */
      }
      .lm-readout svg { width: 1.25rem; height: 1.25rem; }
      .lm-num { font-size: 0.875rem; font-weight: 700; min-width: 2.2ch; }

      .lm-track {
        height: 2.5rem;
        display: flex;
        align-items: center;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.2);
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .lm-fill {
        height: 100%;
        width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        font-size: 0.75rem;
        color: #fff;
        background: linear-gradient(
          90deg,
          rgb(196, 13, 116),
          #a855f7,
          rgb(196, 13, 116)
        );
        transition: width 0.3s;
      }
      .lm-card.is-open .lm-fill { transition: width 0.06s linear; }

      .lm-heart {
        display: flex;
        justify-content: center;
        margin-top: 1.5rem;
        color: #830b9d;
        filter: drop-shadow(0 0 15px rgba(185, 7, 114, 0.5));
        animation: lm-beat 2.4s ease-in-out infinite;
      }
      .lm-heart svg { width: 8rem; height: 8rem; }
      @keyframes lm-beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .lm-status {
        margin-top: 1.25rem;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.6;
        min-height: 2rem; /* السطر بيتبدّل بعد الضغط — من غير ما المكان ينط */
      }
      @media (prefers-reduced-motion: reduce) {
        .lm-heart { animation: none; }
        .lm-fill,
        .lm-card { transition: none !important; }
      }
    </style>

    <!-- ===== preload the heavy stuff so the intro starts instantly ===== -->
    <!-- the video and the first photo are cheap enough to always preload.
         the song is 7.7 MB, so it is NOT preloaded by default - see below. -->
    <link rel="preload" href="./media/video.mp4" as="video" type="video/mp4" />
    <link rel="preload" href="./images/sara-1.jpg" as="image" />

    <!-- Start fetching the song early on a good connection, so the music button
         is instant later. But never on a metered or slow connection, and never
         when the visitor asked to save data - the song cannot be played before
         they press the button anyway, so there is no reason to spend their data. -->
    <script>
      (function () {
        var c = navigator.connection;
        if (c && (c.saveData || /^(slow-2g|2g|3g)$/.test(c.effectiveType || ""))) return;
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "audio";
        l.type = "audio/mpeg";
        l.href = "./media/audio/khalini.mp3";
        document.head.appendChild(l);
      })();
    </script>
